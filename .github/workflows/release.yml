name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for the build (e.g. 1.0.0)"
        required: false

env:
  GODOT_VERSION: "4.5"

jobs:
  signed-release:
    name: Signed AAB + APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi

      - name: Check release secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_USER" ] && missing="$missing ANDROID_KEYSTORE_USER"
          [ -z "$KEYSTORE_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            exit 1
          fi
          echo "Release secrets present"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore

      - name: Inject keystore into the export presets (CI checkout only)
        env:
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION_NAME#v}"
          sed -i "s|^keystore/release=.*|keystore/release=\"/tmp/release.keystore\"|" export_presets.cfg
          sed -i "s|^keystore/release_user=.*|keystore/release_user=\"${KEYSTORE_USER}\"|" export_presets.cfg
          sed -i "s|^keystore/release_password=.*|keystore/release_password=\"${KEYSTORE_PASS}\"|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION}\"|" export_presets.cfg
          grep -c "/tmp/release.keystore" export_presets.cfg

      - name: Import project
        run: bash tools/import_project.sh

      - name: Export signed AAB
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Android Release" build/nightmare-hunter-release.aab

      - name: Export signed APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Android" build/nightmare-hunter-release.apk
          ls -la build

      - name: Verify artifacts
        run: |
          for FILE in build/nightmare-hunter-release.aab build/nightmare-hunter-release.apk; do
            test -s "$FILE" || { echo "::error::$FILE missing"; exit 1; }
            SIZE=$(stat -c%s "$FILE")
            echo "$FILE: ${SIZE} bytes"
            if [ "$SIZE" -gt 157286400 ]; then echo "::error::$FILE exceeds 150 MiB"; exit 1; fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-hunter-release
          path: |
            build/nightmare-hunter-release.aab
            build/nightmare-hunter-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            build/nightmare-hunter-release.aab
            build/nightmare-hunter-release.apk
          fail_on_unmatched_files: true
