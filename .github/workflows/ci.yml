name: CI

on:
  push:
    branches: [main, "stage-*"]
    tags: ["stage-*-done"]
  pull_request:

env:
  GODOT_VERSION: "4.5"
  GUT_VERSION: "9.5.0"

jobs:
  lint:
    name: GDScript lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"
      - name: Lint scripts, tests and tools
        run: gdlint scripts tests tools

  data-and-audio:
    name: Data and audio structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tooling
        run: pip install soundfile numpy
      - name: Validate content data
        run: python tools/validate_data.py
      - name: Validate audio registry and files
        run: python tools/validate_audio.py
      - name: Check every res:// reference
        run: python tools/check_refs.py
      - name: Verify audio assets are up to date
        run: python tools/gen_audio.py --check

  unit-tests:
    name: GUT unit tests
    runs-on: ubuntu-24.04
    needs: lint
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'data/**', 'assets/**') }}
      - name: Fetch GUT
        run: bash tools/fetch_gut.sh
      - name: Import project
        run: bash tools/import_project.sh
      - name: Run GUT
        run: |
          mkdir -p build/reports
          set +e
          godot --headless --audio-driver Dummy -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit -ginclude_subdirs -gexit -glog=1 \
            -gjunit_xml_file=res://build/reports/gut.xml > gut.log 2>&1
          STATUS=$?
          set -e
          tail -n 120 gut.log
          # Public annotations: lets an unauthenticated reader see why it failed.
          grep -nE "SCRIPT ERROR|Parse Error|ERROR:|Failed|FAILED|error" gut.log \
            | head -8 | while IFS= read -r line; do echo "::error title=GUT::$line"; done
          # One annotation with the whole failure block (newlines escaped as %0A).
          BLOCK=$(awk 'seen { print } /\[Failed\]/ { seen = 1; print }' gut.log \
            | head -40 | sed 's/%/%25/g' | paste -sd '|' - | sed 's/|/%0A/g')
          if [ -n "$BLOCK" ]; then
            echo "::error title=GUT-details::$BLOCK"
          fi
          if grep -q "SCRIPT ERROR" gut.log; then
            echo "::error title=GUT::script errors during GUT run"
            exit 1
          fi
          exit $STATUS
      - name: Upload GUT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: build/reports

  smoke:
    name: Scene smoke test
    runs-on: ubuntu-24.04
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
      - name: Import project
        run: bash tools/import_project.sh
      - name: Smoke test every scene with the Dummy audio driver
        run: |
          set +e
          godot --headless --audio-driver Dummy -s tools/smoke_test.gd > smoke.log 2>&1
          STATUS=$?
          set -e
          tail -n 120 smoke.log
          grep -nE "SCRIPT ERROR|Parse Error|ERROR:|FAIL" smoke.log \
            | head -10 | while IFS= read -r line; do echo "::error title=Smoke::$line"; done
          BLOCK=$(tail -n 40 smoke.log | sed 's/%/%25/g' | paste -sd '|' - | sed 's/|/%0A/g')
          if [ -n "$BLOCK" ]; then
            echo "::error title=Smoke-tail::$BLOCK"
          fi
          exit $STATUS

  bot:
    name: Bot playthrough
    runs-on: ubuntu-24.04
    needs: unit-tests
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
      - name: Import project
        run: bash tools/import_project.sh
      - name: Bot completes every world-1 level and boss 1
        run: |
          set +e
          godot --headless --audio-driver Dummy --fixed-fps 60 -s tools/bot_test.gd > bot.log 2>&1
          STATUS=$?
          set -e
          tail -n 150 bot.log
          grep -nE "SCRIPT ERROR|Parse Error|ERROR:|\[bot\] FAIL" bot.log \
            | head -10 | while IFS= read -r line; do echo "::error title=Bot::$line"; done
          BLOCK=$(tail -n 40 bot.log | sed 's/%/%25/g' | paste -sd '|' - | sed 's/|/%0A/g')
          if [ -n "$BLOCK" ]; then
            echo "::error title=Bot-tail::$BLOCK"
          fi
          exit $STATUS

  android-debug:
    name: Debug APK
    runs-on: ubuntu-24.04
    needs: [smoke, bot, data-and-audio]
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
      - name: Import project
        run: bash tools/import_project.sh
      - name: Export debug APK (arm64-v8a, minSdk 24)
        run: |
          mkdir -p build
          set +e
          godot --headless --verbose --export-debug "Android" build/nightmare-hunter-debug.apk \
            > export.log 2>&1
          STATUS=$?
          # keep diagnostics running even when the export failed
          echo "---- export.log tail ----"
          tail -n 60 export.log || true
          echo "---- build dir ----"
          ls -la build || true
          grep -nE "ERROR|error:|Cannot|cannot|missing|not found|Unsupported|Invalid|No export" export.log \
            | head -8 | while IFS= read -r line; do echo "::error title=APK::$line"; done || true
          BLOCK=$(tail -n 25 export.log | sed 's/%/%25/g' | paste -sd '|' - | sed 's/|/%0A/g')
          if [ -n "$BLOCK" ]; then
            echo "::error title=APK-tail::$BLOCK"
          fi
          exit $STATUS
      - name: Verify APK
        run: |
          APK=build/nightmare-hunter-debug.apk
          test -f "$APK" || { echo "::error::APK was not produced"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK size: ${SIZE} bytes"
          if [ "$SIZE" -gt 157286400 ]; then echo "::error::APK exceeds 150 MiB"; exit 1; fi
          unzip -l "$APK" | grep -q "lib/arm64-v8a/" || { echo "::error::arm64-v8a missing"; exit 1; }
          if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
            echo "::error::armeabi-v7a must be excluded"; exit 1
          fi
          echo "APK looks sane"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightmare-hunter-debug-apk
          path: build/nightmare-hunter-debug.apk
          retention-days: 30

  stage-release:
    name: Publish stage APK
    runs-on: ubuntu-24.04
    needs: android-debug
    if: startsWith(github.ref, 'refs/tags/stage-')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nightmare-hunter-debug-apk
          path: build
      - name: Create stage release with the debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} debug build"
          body: |
            Debug APK for ${{ github.ref_name }}.

            Install with `adb install -r nightmare-hunter-debug.apk` on an
            arm64 Android 7.0+ (minSdk 24) device.
          files: build/nightmare-hunter-debug.apk
          fail_on_unmatched_files: true
